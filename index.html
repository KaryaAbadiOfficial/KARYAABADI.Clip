<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipper — Pro Video Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root {
  --bg-0: #07070c;
  --bg-1: #0c0c15;
  --bg-2: #12121e;
  --bg-3: #181826;
  --bg-4: #20202f;
  --bg-5: #2a2a3d;
  --border: #25253a;
  --border-light: #353550;
  --border-bright: #4a4a68;
  --text: #f5f5fa;
  --text-dim: #9a9ab5;
  --text-faint: #5c5c78;
  --accent: #00e5ff;
  --accent-glow: rgba(0, 229, 255, 0.5);
  --accent-2: #b14eff;
  --accent-3: #ff2d75;
  --success: #00d97e;
  --warning: #ffb800;
  --danger: #ff3b5c;
  --video-color: #2563eb;
  --text-track-color: #b14eff;
  --audio-color: #00d97e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg-0);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-1); }
::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--bg-5); }

/* Layout */
.app {
  display: grid;
  grid-template-rows: 56px 1fr 280px;
  height: 100vh;
}

.main-area {
  display: grid;
  grid-template-columns: 280px 1fr 300px;
  overflow: hidden;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
  border-bottom: 1px solid var(--border);
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 20px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: white;
  box-shadow: 0 0 20px var(--accent-glow);
  position: relative;
  overflow: hidden;
}

.logo-icon::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
  animation: shimmer 3s infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.logo-text {
  background: linear-gradient(135deg, #fff, var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-center {
  display: flex;
  align-items: center;
  gap: 12px;
}

.project-name {
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  outline: none;
  width: 200px;
  transition: all 0.2s;
}

.project-name:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.1);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-btn {
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.header-btn:hover {
  background: var(--bg-4);
  color: var(--text);
  border-color: var(--border-light);
}

.btn-export {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  border: none;
  padding: 8px 20px;
  font-weight: 600;
  font-size: 13px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(0, 229, 255, 0.2);
}

.btn-export:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(0, 229, 255, 0.35);
}

.btn-export:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* Left Panel */
.left-panel {
  background: var(--bg-1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.left-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg-2);
}

.left-tab {
  flex: 1;
  padding: 10px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  color: var(--text-faint);
  font-size: 10px;
  font-weight: 500;
  transition: all 0.2s;
  border-bottom: 2px solid transparent;
}

.left-tab i { font-size: 16px; }

.left-tab:hover { color: var(--text-dim); }

.left-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: linear-gradient(180deg, transparent, rgba(0, 229, 255, 0.05));
}

.left-content {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

/* Media Library */
.media-import {
  border: 2px dashed var(--border-light);
  border-radius: 10px;
  padding: 24px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 12px;
  background: var(--bg-2);
}

.media-import:hover {
  border-color: var(--accent);
  background: rgba(0, 229, 255, 0.03);
}

.media-import.drag-over {
  border-color: var(--accent);
  background: rgba(0, 229, 255, 0.08);
  transform: scale(1.02);
}

.media-import i {
  font-size: 28px;
  color: var(--text-faint);
  margin-bottom: 8px;
}

.media-import:hover i { color: var(--accent); }

.media-import p {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 500;
}

.media-import span {
  font-size: 10px;
  color: var(--text-faint);
}

.media-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.media-item {
  position: relative;
  background: var(--bg-3);
  border-radius: 8px;
  overflow: hidden;
  cursor: grab;
  border: 2px solid transparent;
  transition: all 0.2s;
  aspect-ratio: 16/9;
}

.media-item:hover {
  border-color: var(--accent);
  transform: scale(1.03);
}

.media-item:active { cursor: grabbing; }

.media-item img, .media-item video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.media-item .media-info {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 4px 6px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.85));
  font-size: 10px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.media-item .media-duration {
  position: absolute;
  top: 4px;
  right: 4px;
  background: rgba(0,0,0,0.7);
  padding: 2px 5px;
  border-radius: 3px;
  font-size: 9px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}

.media-item .media-type {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
}

.media-type.video { background: var(--video-color); }
.media-type.audio { background: var(--audio-color); }
.media-type.image { background: var(--accent-2); }

/* Filter Presets */
.filter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.filter-preset {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
  aspect-ratio: 16/9;
  background: var(--bg-3);
}

.filter-preset:hover { border-color: var(--border-bright); }
.filter-preset.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,229,255,0.3); }

.filter-preset .filter-preview {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  align-items: center;
  justify-content: center;
}

.filter-preset .filter-name {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 4px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.85));
  font-size: 10px;
  font-weight: 600;
  text-align: center;
}

/* Text Templates */
.text-templates { display: flex; flex-direction: column; gap: 8px; }

.text-template {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.text-template:hover {
  border-color: var(--accent);
  background: var(--bg-4);
  transform: translateY(-1px);
}

.text-template .preview {
  font-weight: 700;
  margin-bottom: 4px;
}

.text-template .label {
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Center / Preview */
.center-area {
  display: flex;
  flex-direction: column;
  background: var(--bg-0);
  overflow: hidden;
}

.preview-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  background: 
    radial-gradient(ellipse at center, var(--bg-1) 0%, var(--bg-0) 100%);
}

.preview-stage {
  position: relative;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 
    0 0 0 1px var(--border),
    0 20px 60px rgba(0,0,0,0.5),
    0 0 80px rgba(0, 229, 255, 0.05);
  max-width: 100%;
  max-height: 100%;
}

.preview-stage::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
  opacity: 0;
  z-index: -1;
  transition: opacity 0.3s;
}

.preview-stage.active::before { opacity: 0.3; }

.preview-video {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

.preview-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  min-height: 300px;
  color: var(--text-faint);
  gap: 12px;
}

.preview-empty i { font-size: 48px; opacity: 0.3; }
.preview-empty p { font-size: 14px; }
.preview-empty span { font-size: 11px; opacity: 0.6; }

.text-overlay {
  position: absolute;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  pointer-events: none;
  user-select: none;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.text-overlay.editable {
  pointer-events: auto;
  cursor: move;
  outline: 2px dashed transparent;
  transition: outline-color 0.2s;
}

.text-overlay.editable:hover { outline-color: var(--accent); }
.text-overlay.editable.selected { outline-color: var(--accent); }

/* Playback Controls */
.playback-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background: var(--bg-2);
  border-top: 1px solid var(--border);
  gap: 16px;
}

.playback-controls {
  display: flex;
  align-items: center;
  gap: 4px;
}

.pb-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: all 0.15s;
}

.pb-btn:hover { background: var(--bg-4); color: var(--text); }

.pb-btn.play {
  width: 42px;
  height: 42px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  font-size: 16px;
  margin: 0 4px;
}

.pb-btn.play:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 16px rgba(0,229,255,0.3);
}

.time-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  background: var(--bg-3);
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  min-width: 100px;
  text-align: center;
}

.time-display .current { color: var(--accent); }
.time-display .separator { color: var(--text-faint); margin: 0 4px; }

.playback-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.aspect-select {
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  outline: none;
}

/* Right Panel */
.right-panel {
  background: var(--bg-1);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.right-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.right-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text);
}

.right-content {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
}

.prop-section {
  margin-bottom: 16px;
  background: var(--bg-2);
  border-radius: 8px;
  border: 1px solid var(--border);
  overflow: hidden;
}

.prop-section-header {
  padding: 10px 12px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  background: var(--bg-3);
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
}

.prop-section-header i { font-size: 10px; transition: transform 0.2s; }
.prop-section.collapsed .prop-section-header i { transform: rotate(-90deg); }
.prop-section.collapsed .prop-section-body { display: none; }

.prop-section-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.prop-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.prop-label {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 500;
  min-width: 60px;
}

.prop-input {
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 5px;
  font-size: 11px;
  outline: none;
  width: 70px;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
}

.prop-input:focus { border-color: var(--accent); }

.prop-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--bg-4);
  border-radius: 2px;
  outline: none;
}

.prop-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 8px rgba(0,229,255,0.4);
}

.prop-slider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  border: none;
  box-shadow: 0 0 8px rgba(0,229,255,0.4);
}

.prop-color {
  width: 32px;
  height: 24px;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  background: transparent;
  padding: 0;
}

.prop-select {
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 5px;
  font-size: 11px;
  outline: none;
  cursor: pointer;
  flex: 1;
}

.prop-textarea {
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px;
  border-radius: 5px;
  font-size: 12px;
  outline: none;
  resize: vertical;
  min-height: 60px;
  width: 100%;
  font-family: inherit;
}

.prop-textarea:focus { border-color: var(--accent); }

.prop-empty {
  text-align: center;
  padding: 40px 16px;
  color: var(--text-faint);
}

.prop-empty i { font-size: 32px; margin-bottom: 8px; opacity: 0.3; }
.prop-empty p { font-size: 12px; }

/* Timeline */
.timeline-area {
  background: var(--bg-1);
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.timeline-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  gap: 12px;
}

.timeline-tools {
  display: flex;
  align-items: center;
  gap: 4px;
}

.tool-btn {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  transition: all 0.15s;
}

.tool-btn:hover { background: var(--bg-4); color: var(--text); }
.tool-btn.active { background: var(--bg-4); color: var(--accent); border-color: var(--accent); }
.tool-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.tool-divider {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 4px;
}

.zoom-control {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-dim);
}

.zoom-slider {
  width: 100px;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: var(--bg-4);
  border-radius: 2px;
  outline: none;
}

.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
}

.timeline-body {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

.track-headers {
  width: 120px;
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.track-header-ruler {
  height: 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 8px;
  font-size: 10px;
  color: var(--text-faint);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.track-header {
  height: 56px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 8px;
}

.track-header-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: white;
}

.track-header-icon.video { background: var(--video-color); }
.track-header-icon.text { background: var(--text-track-color); }
.track-header-icon.audio { background: var(--audio-color); }

.track-header-info { flex: 1; min-width: 0; }
.track-header-name { font-size: 11px; font-weight: 600; }
.track-header-actions {
  display: flex;
  gap: 2px;
}

.track-header-actions button {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  background: transparent;
  border: none;
  color: var(--text-faint);
  cursor: pointer;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.track-header-actions button:hover { background: var(--bg-4); color: var(--text); }

.timeline-scroll {
  flex: 1;
  overflow-x: auto;
  overflow-y: hidden;
  position: relative;
}

.timeline-tracks {
  position: relative;
  min-width: 100%;
}

.ruler {
  height: 28px;
  border-bottom: 1px solid var(--border);
  position: relative;
  background: var(--bg-2);
}

.ruler-tick {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
}

.ruler-tick.major { background: var(--border-light); }

.ruler-label {
  position: absolute;
  top: 4px;
  left: 4px;
  font-size: 9px;
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  white-space: nowrap;
}

.track {
  height: 56px;
  border-bottom: 1px solid var(--border);
  position: relative;
  background: var(--bg-1);
}

.track:nth-child(even) { background: var(--bg-2); }

.clip {
  position: absolute;
  top: 4px;
  height: calc(100% - 8px);
  border-radius: 6px;
  cursor: grab;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
  transition: box-shadow 0.15s;
  border: 2px solid transparent;
}

.clip:active { cursor: grabbing; }

.clip.video {
  background: linear-gradient(135deg, #1e40af, #3b82f6);
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
}

.clip.text {
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
}

.clip.audio {
  background: linear-gradient(135deg, #059669, #10b981);
  box-shadow: 0 2px 8px rgba(5, 150, 105, 0.3);
}

.clip.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent), 0 4px 16px rgba(0,229,255,0.3);
  z-index: 10;
}

.clip-thumbnail {
  flex: 1;
  background: rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.clip-thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.7;
}

.clip-name {
  padding: 3px 8px;
  font-size: 10px;
  font-weight: 600;
  color: white;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  background: rgba(0,0,0,0.25);
  display: flex;
  align-items: center;
  gap: 4px;
}

.clip-name i { font-size: 8px; }

.trim-handle {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 8px;
  cursor: ew-resize;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 5;
}

.clip:hover .trim-handle { opacity: 1; }
.trim-handle:hover { background: rgba(255,255,255,0.3); }
.trim-handle.left { left: 0; border-radius: 6px 0 0 6px; }
.trim-handle.right { right: 0; border-radius: 0 6px 6px 0; }
.trim-handle::after {
  content: '';
  width: 2px;
  height: 16px;
  background: rgba(255,255,255,0.6);
  border-radius: 1px;
}

.playhead {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--accent-3);
  z-index: 50;
  pointer-events: none;
  box-shadow: 0 0 8px rgba(255, 45, 117, 0.5);
}

.playhead::before {
  content: '';
  position: absolute;
  top: 0;
  left: -7px;
  width: 16px;
  height: 16px;
  background: var(--accent-3);
  clip-path: polygon(50% 100%, 0 0, 100% 0);
}

/* Toast */
.toast-container {
  position: fixed;
  bottom: 300px;
  right: 20px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  background: var(--bg-3);
  border: 1px solid var(--border);
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  min-width: 200px;
}

.toast.success { border-color: var(--success); }
.toast.success i { color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast.error i { color: var(--danger); }
.toast.info { border-color: var(--accent); }
.toast.info i { color: var(--accent); }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Export Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 440px;
  max-width: 90vw;
  overflow: hidden;

}

.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 16px;
  font-weight: 700;
}

.modal-close {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close:hover { background: var(--bg-4); color: var(--text); }

.modal-body { padding: 20px; }

.export-option {
  margin-bottom: 16px;
}

.export-option label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);

}

.export-buttons {

  gap: 8px;
}

.export-btn {

.export-btn:hover { border-color: var(--border-bright); color: var(--text); }
.export-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,229,255,0.05); }

.export-progress {

.export-progress.active { display: block; }

.progress-bar {

}

.progress-fill {

.progress-text {

.modal-footer {

/* Hidden file input */

/* Loading spinner */

<script>
// ===================== STATE =====================
const state = {
  media: [], // {id, name, type, url, duration, element, thumbnail}
  tracks: {
    video: { clips: [] },
    text: { clips: [] },
    audio: { clips: [] }
  },
  selectedClipId: null,
  playhead: 0,
  isPlaying: false,
  pps: 60, // pixels per second
  project: { name: 'Proyek Tanpa Judul', width: 1920, height: 1080, fps: 30, aspect: '16/9' },
  activeVideoMediaId: null,
  history: [],
  historyIndex: -1,
  exportSettings: { res: '1920x1080', fmt: 'webm', fps: 30 }
};

// ===================== UTILS =====================
function uid() { return 'id_' + Math.random().toString(36).substr(2, 9); }

function formatTime(s) {
  if (isNaN(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  const ms = Math.floor((s % 1) * 100);
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
}

function formatTimeShort(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function getClip(id) {
  for (const track of Object.values(state.tracks)) {
    const clip = track.clips.find(c => c.id === id);
    if (clip) return clip;
  }
  return null;
}

function getClipTrack(id) {
  for (const [trackId, track] of Object.entries(state.tracks)) {
    const clip = track.clips.find(c => c.id === id);
    if (clip) return trackId;
  }
  return null;
}

function getTimelineDuration() {
  let max = 0;
  for (const track of Object.values(state.tracks)) {
    for (const clip of track.clips) {
      max = Math.max(max, clip.start + clip.duration);
    }
  }
  return max;
}

function getMedia(id) {
  return state.media.find(m => m.id === id);
}

// ===================== TOAST =====================
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: 'check-circle', error: 'circle-exclamation', info: 'circle-info' };
  toast.innerHTML = `<i class="fas fa-${icons[type] || icons.info}"></i><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(20px)';
    toast.style.transition = 'all 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ===================== MEDIA IMPORT =====================
async function handleFiles(files) {
  for (const file of files) {
    if (file.type.startsWith('video/') || file.type.startsWith('image/')) {
      await importMediaFile(file);
    } else if (file.type.startsWith('audio/')) {
      await importAudioFile(file);
    }
  }
  renderMediaLibrary();
  showToast(`${files.length} media berhasil diimport`, 'success');
}

async function importMediaFile(file) {
  const url = URL.createObjectURL(file);
  const isVideo = file.type.startsWith('video/');
  const media = {
    id: uid(),
    name: file.name.replace(/\.[^/.]+$/, ''),
    type: isVideo ? 'video' : 'image',
    url,
    duration: 0,
    element: null,
    thumbnail: null
  };
  
  if (isVideo) {
    const video = document.createElement('video');
    video.src = url;
    video.crossOrigin = 'anonymous';
    video.preload = 'auto';
    video.muted = false;
    
    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        media.duration = video.duration;
        media.element = video;
        // Generate thumbnail
        video.currentTime = Math.min(1, video.duration * 0.1);
        video.onseeked = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 160;
          canvas.height = 90;
          canvas.getContext('2d').drawImage(video, 0, 0, 160, 90);
          media.thumbnail = canvas.toDataURL();
          resolve();
        };
      };
      video.onerror = () => resolve();
    });
  } else {
    const img = new Image();
    img.src = url;
    media.element = img;
    media.thumbnail = url;
    media.duration = 5;
    await new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
  }
  
  state.media.push(media);
}

async function importAudioFile(file) {
  const url = URL.createObjectURL(file);
  const audio = document.createElement('audio');
  audio.src = url;
  audio.preload = 'auto';
  
  await new Promise(resolve => {
    audio.onloadedmetadata = () => {
      state.media.push({
        id: uid(),
        name: file.name.replace(/\.[^/.]+$/, ''),
        type: 'audio',
        url,
        duration: audio.duration,
        element: audio,
        thumbnail: null
      });
      resolve();
    };
    audio.onerror = () => resolve();
  });
}

// ===================== MEDIA LIBRARY RENDER =====================
function renderMediaLibrary() {
  const list = document.getElementById('mediaList');
  const audioList = document.getElementById('audioList');
  list.innerHTML = '';
  audioList.innerHTML = '';
  
  state.media.forEach(media => {
    const item = document.createElement('div');
    item.className = 'media-item';
    item.draggable = true;
    item.dataset.mediaId = media.id;
    
    if (media.type === 'video' || media.type === 'image') {
      if (media.thumbnail) {
        item.innerHTML = `
          <img src="${media.thumbnail}" alt="${media.name}">
          <div class="media-type ${media.type}"><i class="fas fa-${media.type === 'video' ? 'video' : 'image'}"></i></div>
          <div class="media-duration">${media.type === 'video' ? formatTimeShort(media.duration) : 'IMG'}</div>
          <div class="media-info">${media.name}</div>
        `;
      } else {
        item.innerHTML = `<div class="media-info">${media.name}</div>`;
      }
      list.appendChild(item);
    } else if (media.type === 'audio') {
      const audioItem = document.createElement('div');
      audioItem.className = 'media-item';
      audioItem.draggable = true;
      audioItem.dataset.mediaId = media.id;

    }
    
    item.addEventListener('click', () => previewMedia(media));
    item.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('mediaId', media.id);
    });
  });
  
  // Audio items
  state.media.filter(m => m.type === 'audio').forEach(media => {
    const audioItem = document.createElement('div');
    audioItem.className = 'media-item';
    audioItem.draggable = true;
    audioItem.dataset.mediaId = media.id;
    audioItem.style.aspectRatio = 'auto';
    audioItem.style.height = '50px';
    audioItem.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;padding:8px;height:100%;">
        <div class="media-type audio"><i class="fas fa-music"></i></div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${media.name}</div>
          <div style="font-size:10px;color:var(--text-faint);">${formatTimeShort(media.duration)}</div>
        </div>
      </div>
    `;
    audioList.appendChild(audioItem);
    audioItem.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('mediaId', media.id);
    });
  });
}

function previewMedia(media) {
  // Add to timeline at playhead
  const trackId = media.type === 'audio' ? 'audio' : (media.type === 'image' ? 'video' : 'video');
  addClipToTimeline(media.id, trackId, state.playhead);
}

// ===================== CLIP MANAGEMENT =====================
function addClipToTimeline(mediaId, trackId, startTime = 0) {
  const media = getMedia(mediaId);
  if (!media) return;
  
  // Find non-overlapping position
  let start = startTime;
  const trackClips = state.tracks[trackId].clips;
  
  // Simple non-overlap: find next available slot
  for (const clip of trackClips) {
    if (start < clip.start + clip.duration && start + media.duration > clip.start) {
      start = clip.start + clip.duration;
    }
  }
  
  const clip = {
    id: uid(),
    mediaId,
    trackId,
    start,
    duration: media.duration || 5,
    trimStart: 0,
    trimEnd: 0,
    speed: 1,
    volume: 1,
    filters: {
      brightness: 100,
      contrast: 100,
      saturation: 100,
      blur: 0,
      hue: 0,
      grayscale: 0,
      sepia: 0,
      invert: 0
    },
    filterPreset: 'none'
  };
  
  if (trackId === 'text') {
    clip.text = 'Teks Baru';
    clip.fontSize = 48;
    clip.color = '#ffffff';
    clip.fontFamily = 'Plus Jakarta Sans';
    clip.bold = true;
    clip.italic = false;
    clip.x = 50;
    clip.y = 50;
    clip.duration = 3;
  }
  
  state.tracks[trackId].clips.push(clip);
  state.selectedClipId = clip.id;
  renderTimeline();
  renderProperties();
  updatePreview();
  showToast(`Klip ditambahkan ke track ${trackId}`, 'success');
}

function moveClip(clipId, newStart, newTrackId) {
  const clip = getClip(clipId);
  if (!clip) return;
  
  if (newTrackId && newTrackId !== clip.trackId) {
    // Move to different track
    const oldTrack = state.tracks[clip.trackId];
    const newTrack = state.tracks[newTrackId];
    oldTrack.clips = oldTrack.clips.filter(c => c.id !== clipId);
    clip.trackId = newTrackId;
    clip.start = Math.max(0, newStart);
    newTrack.clips.push(clip);
  } else {
    clip.start = Math.max(0, newStart);
  }
}

function trimClip(clipId, edge, delta) {
  const clip = getClip(clipId);
  if (!clip) return;
  
  if (edge === 'left') {
    const newStart = Math.max(0, clip.start + delta);
    const newTrimStart = clip.trimStart + delta;
    const newDuration = clip.duration - delta;
    if (newTrimStart >= 0 && newDuration > 0.3) {
      clip.start = newStart;
      clip.trimStart = newTrimStart;
      clip.duration = newDuration;
    }
  } else if (edge === 'right') {
    const newDuration = clip.duration + delta;
    if (newDuration > 0.3) {
      clip.duration = newDuration;
    }
  }
}

function splitClip(clipId, atTime) {
  const clip = getClip(clipId);
  if (!clip) return;
  if (atTime <= clip.start || atTime >= clip.start + clip.duration) return;
  
  const offset = atTime - clip.start;
  const newClip = { ...clip, id: uid(), start: atTime, duration: clip.duration - offset, trimStart: clip.trimStart + offset };
  clip.duration = offset;
  
  state.tracks[clip.trackId].clips.push(newClip);
  state.selectedClipId = newClip.id;
  renderTimeline();
  renderProperties();
  showToast('Klip dipotong', 'info');
}

function deleteClip(clipId) {
  for (const track of Object.values(state.tracks)) {
    const idx = track.clips.findIndex(c => c.id === clipId);
    if (idx >= 0) {
      track.clips.splice(idx, 1);
      if (state.selectedClipId === clipId) state.selectedClipId = null;
      renderTimeline();
      renderProperties();
      updatePreview();
      showToast('Klip dihapus', 'info');
      return;
    }
  }
}

// ===================== TIMELINE RENDER =====================
function renderTimeline() {
  const tracks = document.querySelectorAll('.track');
  tracks.forEach(t => t.innerHTML = '');
  
  for (const [trackId, track] of Object.entries(state.tracks)) {
    const trackEl = document.querySelector(`.track[data-track="${trackId}"]`);
    if (!trackEl) continue;
    
    track.clips.forEach(clip => {
      const clipEl = document.createElement('div');
      clipEl.className = `clip ${trackId}`;
      clipEl.dataset.clipId = clip.id;
      clipEl.style.left = `${clip.start * state.pps}px`;
      clipEl.style.width = `${clip.duration * state.pps}px`;
      
      if (clip.id === state.selectedClipId) {
        clipEl.classList.add('selected');
      }
      
      const media = getMedia(clip.mediaId);
      const name = trackId === 'text' ? clip.text : (media ? media.name : 'Klip');
      const icon = trackId === 'video' ? 'video' : (trackId === 'text' ? 'font' : 'music');
      
      let thumbHtml = '';
      if (trackId === 'video' && media && media.thumbnail) {
        thumbHtml = `<img src="${media.thumbnail}" alt="">`;
      } else if (trackId === 'audio') {
        thumbHtml = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:0.5;"><i class="fas fa-waveform-lines" style="font-size:20px;"></i></div>`;
      }
      
      clipEl.innerHTML = `
        <div class="clip-thumbnail">${thumbHtml}</div>
        <div class="clip-name"><i class="fas fa-${icon}"></i>${name}</div>
        <div class="trim-handle left"></div>
        <div class="trim-handle right"></div>
      `;
      
      trackEl.appendChild(clipEl);
    });
  }
  
  renderRuler();
  updatePlayhead();
  updateTimelineWidth();
}

function renderRuler() {
  const ruler = document.getElementById('ruler');
  ruler.innerHTML = '';
  const duration = Math.max(30, getTimelineDuration() + 10);
  const interval = state.pps < 40 ? 5 : (state.pps < 80 ? 2 : 1);
  
  for (let t = 0; t <= duration; t += interval) {
    const tick = document.createElement('div');
    tick.className = 'ruler-tick major';
    tick.style.left = `${t * state.pps}px`;
    ruler.appendChild(tick);
    
    if (t > 0 || interval >= 5) {
      const label = document.createElement('div');
      label.className = 'ruler-label';
      label.style.left = `${t * state.pps + 4}px`;
      label.textContent = formatTimeShort(t);
      ruler.appendChild(label);
    }
    
    // Minor ticks
    if (state.pps >= 40) {
      for (let j = 1; j < interval; j++) {
        const minor = document.createElement('div');
        minor.className = 'ruler-tick';
        minor.style.left = `${(t + j) * state.pps}px`;
        minor.style.height = '6px';
        minor.style.bottom = '';
        minor.style.top = 'auto';
        ruler.appendChild(minor);
      }
    }
  }
}

function updateTimelineWidth() {
  const tracks = document.getElementById('timelineTracks');
  const duration = Math.max(30, getTimelineDuration() + 10);
  tracks.style.width = `${duration * state.pps + 100}px`;
}

function updatePlayhead() {
  const playhead = document.getElementById('playhead');
  playhead.style.left = `${state.playhead * state.pps}px`;
  
  const display = document.getElementById('timeDisplay');
  display.querySelector('.current').textContent = formatTime(state.playhead);
  display.querySelector('.total').textContent = formatTime(getTimelineDuration());
}

// ===================== TIMELINE INTERACTION =====================
let dragState = null;

function setupTimelineInteraction() {
  const scroll = document.getElementById('timelineScroll');
  
  scroll.addEventListener('mousedown', (e) => {
    const clipEl = e.target.closest('.clip');
    const trackEl = e.target.closest('.track');
    const rulerEl = e.target.closest('.ruler');
    
    if (clipEl) {
      const clipId = clipEl.dataset.clipId;
      const clip = getClip(clipId);
      if (!clip) return;
      
      state.selectedClipId = clipId;
      renderTimeline();
      renderProperties();
      
      if (e.target.classList.contains('trim-handle')) {
        const edge = e.target.classList.contains('left') ? 'left' : 'right';
        dragState = {
          type: 'trim',
          clipId,
          edge,
          startX: e.clientX,
          originalStart: clip.start,
          originalDuration: clip.duration,
          originalTrimStart: clip.trimStart
        };
      } else {
        dragState = {
          type: 'move',
          clipId,
          startX: e.clientX,
          originalStart: clip.start
        };
      }
      e.preventDefault();
    } else if (trackEl || rulerEl) {
      // Move playhead
      const rect = scroll.getBoundingClientRect();
      const scrollLeft = scroll.scrollLeft;
      const x = e.clientX - rect.left + scrollLeft;
      const time = Math.max(0, x / state.pps);
      seek(time);
    }
  });
  
  document.addEventListener('mousemove', (e) => {
    if (!dragState) return;
    
    const dx = e.clientX - dragState.startX;
    const dt = dx / state.pps;
    
    if (dragState.type === 'move') {
      const newStart = Math.max(0, dragState.originalStart + dt);
      moveClip(dragState.clipId, newStart);
      renderTimeline();
    } else if (dragState.type === 'trim') {
      trimClip(dragState.clipId, dragState.edge, dt);
      renderTimeline();
      renderProperties();
    }
  });
  
  document.addEventListener('mouseup', () => {
    if (dragState) {
      dragState = null;
      updatePreview();
    }
  });
  
  // Drag from media library
  const tracks = document.querySelectorAll('.track');
  tracks.forEach(track => {
    track.addEventListener('dragover', (e) => {
      e.preventDefault();
      track.style.background = 'rgba(0,229,255,0.05)';
    });
    track.addEventListener('dragleave', () => {
      track.style.background = '';
    });
    track.addEventListener('drop', (e) => {
      e.preventDefault();
      track.style.background = '';
      const mediaId = e.dataTransfer.getData('mediaId');
      if (mediaId) {
        const rect = track.getBoundingClientRect();
        const scroll = document.getElementById('timelineScroll');
        const x = e.clientX - rect.left + scroll.scrollLeft;
        const time = Math.max(0, x / state.pps);
        addClipToTimeline(mediaId, track.dataset.track, time);
      }
    });
  });
}

// ===================== PLAYBACK =====================
let lastFrameTime = 0;
let playbackRAF = null;

function togglePlay() {
  if (state.isPlaying) {
    pause();
  } else {
    play();
  }
}

function play() {
  if (getTimelineDuration() === 0) {
    showToast('Timeline kosong. Tambahkan klip dulu.', 'error');
    return;
  }
  
  if (state.playhead >= getTimelineDuration()) {
    state.playhead = 0;
  }
  
  state.isPlaying = true;
  lastFrameTime = performance.now();
  document.getElementById('btnPlay').innerHTML = '<i class="fas fa-pause"></i>';
  
  playbackLoop();
}

function pause() {
  state.isPlaying = false;
  document.getElementById('btnPlay').innerHTML = '<i class="fas fa-play"></i>';
  
  // Pause all media
  state.media.forEach(m => {
    if (m.element && m.element.tagName === 'VIDEO') {
      m.element.pause();
    }
  });
  
  if (playbackRAF) {
    cancelAnimationFrame(playbackRAF);
    playbackRAF = null;
  }
}

function seek(time) {
  state.playhead = time;
  updatePlayhead();
  updatePreview();
}

function playbackLoop() {
  if (!state.isPlaying) return;
  
  const now = performance.now();
  const dt = (now - lastFrameTime) / 1000;
  lastFrameTime = now;
  
  state.playhead += dt;
  
  if (state.playhead >= getTimelineDuration()) {
    state.playhead = getTimelineDuration();
    pause();
    return;
  }
  
  updatePlayhead();
  updateActiveMedia(state.playhead, true);
  
  playbackRAF = requestAnimationFrame(playbackLoop);
}

// ===================== PREVIEW =====================
function updatePreview() {
  updateActiveMedia(state.playhead, false);
}

function updateActiveMedia(time, isPlaying) {
  const stage = document.getElementById('previewStage');
  const empty = document.getElementById('previewEmpty');
  
  // Find active video clip
  const videoClip = state.tracks.video.clips.find(c => time >= c.start && time < c.start + c.duration);
  const textClips = state.tracks.text.clips.filter(c => time >= c.start && time < c.start + c.duration);
  const audioClips = state.tracks.audio.clips.filter(c => time >= c.start && time < c.start + c.duration);
  
  if (videoClip) {
    const media = getMedia(videoClip.mediaId);
    if (media && media.element) {
      if (state.activeVideoMediaId !== media.id) {
        // Switch video
        stage.querySelectorAll('.preview-video').forEach(v => v.remove());
        
        if (media.element.tagName === 'VIDEO') {
          media.element.className = 'preview-video';
          media.element.style.display = 'block';
          stage.appendChild(media.element);
        } else {
          // Image
          const img = document.createElement('img');
          img.className = 'preview-video';
          img.src = media.url;
          stage.appendChild(img);
        }
        
        if (empty) empty.style.display = 'none';
        state.activeVideoMediaId = media.id;
      }
      
      // Apply filters
      if (media.element.tagName === 'VIDEO' || media.element.tagName === 'IMG') {
        media.element.style.filter = getFilterString(videoClip.filters);
      }
      
      // Seek video
      if (media.element.tagName === 'VIDEO') {
        const sourceTime = videoClip.trimStart + (time - videoClip.start) * videoClip.speed;
        if (Math.abs(media.element.currentTime - sourceTime) > 0.15) {
          try { media.element.currentTime = sourceTime; } catch(e) {}
        }
        media.element.playbackRate = videoClip.speed;
        media.element.volume = videoClip.volume;
        
        if (isPlaying && media.element.paused) {
          media.element.play().catch(() => {});
        } else if (!isPlaying && !media.element.paused) {
          media.element.pause();
        }
      }
    }
  } else {
    stage.querySelectorAll('.preview-video').forEach(v => v.remove());
    state.activeVideoMediaId = null;
    if (empty) empty.style.display = 'flex';
  }
  
  // Update text overlays
  stage.querySelectorAll('.text-overlay').forEach(el => el.remove());
  
  textClips.forEach(clip => {
    const overlay = document.createElement('div');
    overlay.className = 'text-overlay';
    overlay.dataset.clipId = clip.id;
    overlay.textContent = clip.text;
    overlay.style.left = `${clip.x}%`;
    overlay.style.top = `${clip.y}%`;
    overlay.style.fontSize = `${clip.fontSize}px`;
    overlay.style.color = clip.color;
    overlay.style.fontFamily = clip.fontFamily;
    overlay.style.fontWeight = clip.bold ? '700' : '400';
    overlay.style.fontStyle = clip.italic ? 'italic' : 'normal';
    stage.appendChild(overlay);
  });
  
  // Handle audio
  audioClips.forEach(clip => {
    const media = getMedia(clip.mediaId);
    if (media && media.element) {
      const sourceTime = clip.trimStart + (time - clip.start) * clip.speed;
      if (Math.abs(media.element.currentTime - sourceTime) > 0.15) {
        try { media.element.currentTime = sourceTime; } catch(e) {}
      }
      media.element.volume = clip.volume;
      if (isPlaying && media.element.paused) {
        media.element.play().catch(() => {});
      } else if (!isPlaying && !media.element.paused) {
        media.element.pause();
      }
    }
  });
  
  // Pause non-active media
  state.media.forEach(m => {
    if (m.element && m.element.tagName === 'VIDEO') {
      const isActive = videoClip && videoClip.mediaId === m.id;
      const isActiveAudio = audioClips.some(c => c.mediaId === m.id);
      if (!isActive && !isActiveAudio && !m.element.paused) {
        m.element.pause();
      }
    }
    if (m.element && m.element.tagName === 'AUDIO') {
      const isActiveAudio = audioClips.some(c => c.mediaId === m.id);
      if (!isActiveAudio && !m.element.paused) {
        m.element.pause();
      }
    }
  });
}

function getFilterString(filters) {
  return `brightness(${filters.brightness}%) contrast(${filters.contrast}%) saturate(${filters.saturation}%) blur(${filters.blur}px) hue-rotate(${filters.hue}deg) grayscale(${filters.grayscale}%) sepia(${filters.sepia}%) invert(${filters.invert}%)`;
}

function setupPropertyListeners(clip) {
  const bind = (sliderId, numId, prop, transform = v => v, isFilter = false) => {
    const slider = document.getElementById(sliderId);
    const num = document.getElementById(numId);
    if (!slider) return;
    
    const update = (val) => {
      const v = parseFloat(val);
      if (isFilter) {
        clip.filters[prop] = v;
      } else {
        clip[prop] = transform(v);
      }
      if (slider.value != v) slider.value = v;
      if (num && num.value != v) num.value = v;
      renderTimeline();
      updatePreview();
    };
    
    slider.addEventListener('input', () => update(slider.value));
    if (num) num.addEventListener('input', () => update(num.value));
  };
  
  // Start / Duration
  const start = document.getElementById('propStart');
  if (start) {
    start.addEventListener('input', () => {
      clip.start = Math.max(0, parseFloat(start.value) || 0);
      renderTimeline();
      updatePreview();
    });
  }
  
  const dur = document.getElementById('propDuration');
  if (dur) {
    dur.addEventListener('input', () => {
      clip.duration = Math.max(0.1, parseFloat(dur.value) || 0.1);
      renderTimeline();
      updatePreview();
    });
  }
  
  if (clip.trackId === 'video' || clip.trackId === 'audio') {
    bind('propSpeed', 'propSpeedNum', 'speed');
    bind('propVolume', 'propVolumeNum', 'volume', v => v / 100);
  }
  
  if (clip.trackId === 'video') {
    bind('propBrightness', 'propBrightnessNum', 'brightness', v => v, true);
    bind('propContrast', 'propContrastNum', 'contrast', v => v, true);
    bind('propSaturation', 'propSaturationNum', 'saturation', v => v, true);
    bind('propBlur', 'propBlurNum', 'blur', v => v, true);
    bind('propHue', 'propHueNum', 'hue', v => v, true);
    bind('propGrayscale', 'propGrayscaleNum', 'grayscale', v => v, true);
    bind('propSepia', 'propSepiaNum', 'sepia', v => v, true);
  }
  
  if (clip.trackId === 'text') {
    const text = document.getElementById('propText');
    if (text) {
      text.addEventListener('input', () => {
        clip.text = text.value;
        renderTimeline();
        updatePreview();
      });
    }
    
    const font = document.getElementById('propFont');
    if (font) {
      font.addEventListener('change', () => {
        clip.fontFamily = font.value;
        updatePreview();
      });
    }
    
    bind('propFontSize', 'propFontSizeNum', 'fontSize');
    bind('propX', 'propXNum', 'x');
    bind('propY', 'propYNum', 'y');
    
    const color = document.getElementById('propColor');
    if (color) {
      color.addEventListener('input', () => {
        clip.color = color.value;
        updatePreview();
      });
    }
    
    const bold = document.getElementById('propBold');
    if (bold) {
      bold.addEventListener('click', () => {
        clip.bold = !clip.bold;
        renderProperties();
        updatePreview();
      });
    }
    
    const italic = document.getElementById('propItalic');
    if (italic) {
      italic.addEventListener('click', () => {
        clip.italic = !clip.italic;
        renderProperties();
        updatePreview();
      });
    }
  }
  
  // Duplicate
  const dup = document.getElementById('propDuplicate');
  if (dup) {
    dup.addEventListener('click', () => {
      const newClip = { ...clip, id: uid(), start: clip.start + clip.duration };
      state.tracks[clip.trackId].clips.push(newClip);
      state.selectedClipId = newClip.id;
      renderTimeline();
      renderProperties();
      showToast('Klip diduplikat', 'success');
    });
  }
  
  // Delete
  const del = document.getElementById('propDelete');
  if (del) {
    del.addEventListener('click', () => deleteClip(clip.id));
  }
}

// ===================== EXPORT =====================
let exportCancelled = false;

async function exportVideo() {
  const duration = getTimelineDuration();
  if (duration === 0) {
    showToast('Timeline kosong. Tidak bisa export.', 'error');
    return;
  }
  
  const modal = document.getElementById('exportModal');
  const progress = document.getElementById('exportProgress');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const startBtn = document.getElementById('exportStart');
  
  modal.classList.add('active');
  
  startBtn.onclick = async () => {
    exportCancelled = false;
    progress.classList.add('active');
    startBtn.disabled = true;
    startBtn.innerHTML = '<div class="spinner"></div> Mengexport...';
    
    try {
      const [w, h] = state.exportSettings.res.split('x').map(Number);
      const fps = state.exportSettings.fps;
      
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      
      const stream = canvas.captureStream(fps);
      
      // Audio mixing
      let audioStream = null;
      try {
        const audioCtx = new AudioContext();
        const destination = audioCtx.createMediaStreamDestination();
        
        // Connect all audio sources
        state.media.forEach(m => {
          if (m.element && (m.element.tagName === 'VIDEO' || m.element.tagName === 'AUDIO')) {
            try {
              const source = audioCtx.createMediaElementSource(m.element);
              source.connect(destination);
              source.connect(audioCtx.destination);
            } catch(e) {}
          }
        });
        
        if (destination.stream.getAudioTracks().length > 0) {
          destination.stream.getAudioTracks().forEach(track => stream.addTrack(track));
        }
      } catch(e) {
        console.warn('Audio setup failed:', e);
      }
      
      const mimeType = state.exportSettings.fmt === 'webm-vp9' ? 'video/webm;codecs=vp9' 
                     : state.exportSettings.fmt === 'webm-opus' ? 'video/webm;codecs=opus'
                     : 'video/webm';
      
      const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
      const chunks = [];
      
      recorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };
      
      const exportPromise = new Promise(resolve => {
        recorder.onstop = resolve;
      });
      
      recorder.start();
      
      // Play timeline
      pause();
      state.playhead = 0;
      
      const totalFrames = Math.ceil(duration * fps);
      const frameTime = 1 / fps;
      
      for (let frame = 0; frame < totalFrames; frame++) {
        if (exportCancelled) break;
        
        const t = frame * frameTime;
        state.playhead = t;
        
        // Update media
        updateActiveMedia(t, false);
        
        // Wait for seek
        await new Promise(r => setTimeout(r, 1000 / fps + 30));
        
        // Draw to canvas
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        
        const videoClip = state.tracks.video.clips.find(c => t >= c.start && t < c.start + c.duration);
        if (videoClip) {
          const media = getMedia(videoClip.mediaId);
          if (media && media.element) {
            ctx.filter = getFilterString(videoClip.filters);
            try {
              const elemW = media.element.videoWidth || media.element.naturalWidth || w;
              const elemH = media.element.videoHeight || media.element.naturalHeight || h;
              const scale = Math.min(w / elemW, h / elemH);
              const dw = elemW * scale;
              const dh = elemH * scale;
              const dx = (w - dw) / 2;
              const dy = (h - dh) / 2;
              ctx.drawImage(media.element, dx, dy, dw, dh);
            } catch(e) {}
            ctx.filter = 'none';
          }
        }
        
        // Draw text overlays
        const textClips = state.tracks.text.clips.filter(c => t >= c.start && t < c.start + c.duration);
        textClips.forEach(clip => {
          ctx.font = `${clip.bold ? 'bold ' : ''}${clip.italic ? 'italic ' : ''}${clip.fontSize * (h / 1080)}px ${clip.fontFamily}`;
          ctx.fillStyle = clip.color;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0,0,0,0.5)';
          ctx.shadowBlur = 8;
          ctx.shadowOffsetY = 2;
          ctx.fillText(clip.text, (clip.x / 100) * w, (clip.y / 100) * h);
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;
        });
        
        const percent = ((frame + 1) / totalFrames * 100).toFixed(1);
        progressFill.style.width = `${percent}%`;
        progressText.textContent = `Rendering... ${percent}% • Frame ${frame + 1}/${totalFrames}`;
        
        await new Promise(r => setTimeout(r, 10));
      }
      
      recorder.stop();
      await exportPromise;
      
      pause();
      
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.project.name || 'clipper-export'}.webm`;
      a.click();
      URL.revokeObjectURL(url);
      
      progress.classList.remove('active');
      startBtn.disabled = false;
      startBtn.innerHTML = '<i class="fas fa-download"></i> Mulai Export';
      modal.classList.remove('active');
      
      showToast('Video berhasil diexport!', 'success');
    } catch(e) {
      console.error(e);
      showToast('Export gagal: ' + e.message, 'error');
      progress.classList.remove('active');
      startBtn.disabled = false;
      startBtn.innerHTML = '<i class="fas fa-download"></i> Mulai Export';
    }
  };
}

function setupEventListeners() {
  // Tab switching
  document.querySelectorAll('.left-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.left-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
      document.querySelector(`.tab-panel[data-panel="${tab.dataset.tab}"]`).style.display = 'block';
    });
  });
  
  // Media import
  const mediaImport = document.getElementById('mediaImport');
  const fileInput = document.getElementById('fileInput');
  
  mediaImport.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFiles(e.target.files);
    fileInput.value = '';
  });
  
  mediaImport.addEventListener('dragover', (e) => {
    e.preventDefault();
    mediaImport.classList.add('drag-over');
  });
  mediaImport.addEventListener('dragleave', () => mediaImport.classList.remove('drag-over'));
  mediaImport.addEventListener('drop', (e) => {
    e.preventDefault();
    mediaImport.classList.remove('drag-over');
    if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });
  
  // Audio import
  const audioImport = document.getElementById('audioImport');
  const audioInput = document.getElementById('audioInput');
  audioImport.addEventListener('click', () => audioInput.click());
  audioInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFiles(e.target.files);
    audioInput.value = '';
  });
  
  // Playback
  document.getElementById('btnPlay').addEventListener('click', togglePlay);
  document.getElementById('btnSkipStart').addEventListener('click', () => seek(0));
  document.getElementById('btnSkipEnd').addEventListener('click', () => seek(getTimelineDuration()));
  document.getElementById('btnFramePrev').addEventListener('click', () => seek(Math.max(0, state.playhead - 1/30)));
  document.getElementById('btnFrameNext').addEventListener('click', () => seek(state.playhead + 1/30));
  
  // Aspect ratio
  document.getElementById('aspectSelect').addEventListener('change', (e) => {
    const stage = document.getElementById('previewStage');
    stage.style.aspectRatio = e.target.value;
    state.project.aspect = e.target.value;
  });
  
  // Zoom
  document.getElementById('zoomSlider').addEventListener('input', (e) => {
    state.pps = parseInt(e.target.value);
    renderTimeline();
  });
  
  // Tools
  document.getElementById('toolSplit').addEventListener('click', () => {
    if (state.selectedClipId) {
      const clip = getClip(state.selectedClipId);
      if (clip) {
        splitClip(clip.id, state.playhead);
      }
    } else {
      showToast('Pilih klip dulu untuk dipotong', 'error');
    }
  });
  
  document.getElementById('toolDelete').addEventListener('click', () => {
    if (state.selectedClipId) {
      deleteClip(state.selectedClipId);
    } else {
      showToast('Pilih klip dulu untuk dihapus', 'error');
    }
  });
  
  document.getElementById('toolFit').addEventListener('click', () => {
    const duration = getTimelineDuration();
    if (duration > 0) {
      const scroll = document.getElementById('timelineScroll');
      const width = scroll.clientWidth - 100;
      state.pps = Math.min(200, Math.max(20, width / duration));
      document.getElementById('zoomSlider').value = state.pps;
      renderTimeline();
    }
  });
  
  // Project name
  document.getElementById('projectName').addEventListener('input', (e) => {
    state.project.name = e.target.value;
  });
  
  // Demo
  document.getElementById('btnLoadDemo').addEventListener('click', loadDemo);
  
  // Save
  document.getElementById('btnSave').addEventListener('click', () => {
    const data = {
      project: state.project,
      tracks: state.tracks.map(t => ({ ...t, clips: t.clips.map(c => ({ ...c, element: undefined })) })),
      media: state.media.map(m => ({ ...m, element: undefined }))
    };
    localStorage.setItem('clipper-project', JSON.stringify(data));
    showToast('Proyek disimpan ke browser', 'success');
  });
  
  // Export
  document.getElementById('btnExport').addEventListener('click', exportVideo);
  document.getElementById('exportClose').addEventListener('click', () => {
    exportCancelled = true;
    document.getElementById('exportModal').classList.remove('active');
  });
  document.getElementById('exportCancel').addEventListener('click', () => {
    exportCancelled = true;
    document.getElementById('exportModal').classList.remove('active');
  });
  
  // Export settings
  document.querySelectorAll('.export-btn[data-res]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.export-btn[data-res]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.exportSettings.res = btn.dataset.res;
    });
  });
  document.querySelectorAll('.export-btn[data-fmt]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.export-btn[data-fmt]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.exportSettings.fmt = btn.dataset.fmt;
    });
  });
  document.querySelectorAll('.export-btn[data-fps]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.export-btn[data-fps]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.exportSettings.fps = parseInt(btn.dataset.fps);
    });
  });
  
  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.key === 'Delete' || e.key === 'Backspace') {
      if (state.selectedClipId) {
        e.preventDefault();
        deleteClip(state.selectedClipId);
      }
    } else if (e.key === 's' || e.key === 'S') {
      if (state.selectedClipId) {
        const clip = getClip(state.selectedClipId);
        if (clip) splitClip(clip.id, state.playhead);
      }
    } else if (e.key === 'ArrowLeft') {
      seek(Math.max(0, state.playhead - (e.shiftKey ? 1 : 1/30)));
    } else if (e.key === 'ArrowRight') {
      seek(state.playhead + (e.shiftKey ? 1 : 1/30));
    }
  });
  
  // Timeline scroll sync
  document.getElementById('timelineScroll').addEventListener('scroll', (e) => {
    const ruler = document.getElementById('ruler');
    ruler.style.transform = `translateX(${-e.target.scrollLeft}px)`;
  });
  
  // Global drag for media
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files.length && !e.target.closest('.media-import')) {
      handleFiles(e.dataTransfer.files);
    }
  });
}

// ===================== INIT =====================
function init() {
  renderMediaLibrary();
  renderFilterPresets();
  renderTextTemplates();
  renderTimeline();
  renderProperties();
  setupTimelineInteraction();
  setupEventListeners();
  
  // Set initial aspect ratio
  document.getElementById('previewStage').style.aspectRatio = '16/9';
  
  showToast('Selamat datang di Clipper! Import media atau klik Demo.', 'info');
}

init();
</script>
</body>
</html>
